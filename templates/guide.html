{% extends "base.html" %} {% block body %}
<style>
  .guide h1 {
    font-size: 1.75rem;
    font-weight: 700;
    margin-bottom: 0.75rem;
  }
  .guide h2 {
    font-size: 1.35rem;
    font-weight: 700;
    margin: 1.25rem 0 0.5rem;
  }
  .guide h3 {
    font-size: 1.1rem;
    font-weight: 700;
    margin: 1rem 0 0.4rem;
  }
  .guide p,
  .guide ul,
  .guide ol,
  .guide pre {
    margin-bottom: 0.75rem;
  }
  .guide ul {
    list-style: disc;
    padding-left: 1.5rem;
  }
  .guide ol {
    list-style: decimal;
    padding-left: 1.5rem;
  }
  .guide code {
    background: #e5e7eb;
    padding: 0 0.25rem;
    border-radius: 0.25rem;
  }
  .guide pre {
    background: #e5e7eb;
    padding: 0.75rem;
    border-radius: 0.25rem;
    overflow-x: auto;
  }
  .guide pre code {
    background: none;
    padding: 0;
  }
  .guide a {
    color: #2563eb;
    text-decoration: underline;
  }
  .dark .guide code,
  .dark .guide pre {
    background: #374151;
  }
</style>
<div class="guide bg-white p-6 rounded shadow">
  <a href="/" title="All tools" class="inline-block mb-4">
    <svg
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M19 12H5M12 19l-7-7 7-7" />
    </svg>
  </a>
  {{ content|safe }}
</div>
{% endblock %}
