<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <script>
      (function () {
        let theme = null;
        try {
          theme = localStorage.getItem("theme");
        } catch (error) {}
        if (!theme)
          theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      :root {
        --bg: #ffffff;
        --text: #1c2530;
        --nav-bg: #fafbfc;
        --nav-hover: #e8eef5;
        --accent: #1f5f99;
        --border: #d6dde5;
        --muted: #5b6672;
        --code-bg: #f3f5f8;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --bg: #14181d;
        --text: #dde3ea;
        --nav-bg: #1a1f26;
        --nav-hover: #263040;
        --accent: #6db3f2;
        --border: #333c47;
        --muted: #98a3b0;
        --code-bg: #20262e;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.55;
        display: flex;
        min-height: 100vh;
      }
      nav {
        width: 260px;
        flex-shrink: 0;
        border-right: 1px solid var(--border);
        padding: 24px 16px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        background: var(--nav-bg);
      }
      #theme-toggle {
        width: 100%;
        margin: 0 0 12px;
        padding: 6px 8px;
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        cursor: pointer;
      }
      nav h1 {
        font-size: 15px;
        margin: 0 0 16px;
      }
      #search {
        margin: 0 0 12px;
      }
      #search-input {
        width: 100%;
        padding: 6px 8px;
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
      }
      #search-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      #search-count {
        flex: 1;
      }
      #search-controls button {
        padding: 1px 8px;
        font: inherit;
        color: var(--text);
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        cursor: pointer;
      }
      nav a[hidden] {
        display: none;
      }
      mark.search-hit {
        background: #ffe066;
        color: #000;
      }
      mark.search-hit.current {
        background: #ff9632;
        outline: 2px solid #ff9632;
      }
      nav a {
        display: block;
        padding: 6px 8px;
        color: var(--accent);
        text-decoration: none;
        border-radius: 4px;
        font-size: 14px;
      }
      nav a:hover {
        background: var(--nav-hover);
      }
      main {
        flex: 1;
        max-width: 960px;
        padding: 24px 40px 80px;
      }
      section.doc {
        padding-bottom: 32px;
        margin-bottom: 32px;
        border-bottom: 2px solid var(--border);
      }
      h1 {
        font-size: 26px;
        margin-top: 0;
      }
      h2 {
        font-size: 20px;
        margin-top: 28px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 4px;
      }
      h3 {
        font-size: 16px;
        margin-top: 20px;
      }
      a {
        color: var(--accent);
      }
      table {
        border-collapse: collapse;
        margin: 12px 0;
        width: 100%;
        font-size: 14px;
      }
      th,
      td {
        border: 1px solid var(--border);
        padding: 6px 10px;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: var(--code-bg);
      }
      code {
        background: var(--code-bg);
        padding: 1px 5px;
        border-radius: 3px;
        font-family: Consolas, monospace;
        font-size: 13px;
      }
      pre {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 12px;
        overflow-x: auto;
      }
      pre code {
        background: none;
        padding: 0;
      }
      pre {
        position: relative;
      }
      .copy-code {
        position: absolute;
        top: 6px;
        right: 6px;
        padding: 2px 8px;
        font: inherit;
        font-size: 12px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        cursor: pointer;
        opacity: 0.75;
      }
      .copy-code:hover {
        opacity: 1;
      }
      .meta {
        color: var(--muted);
      }
      img {
        max-width: 100%;
        height: auto;
        border: 1px solid var(--border);
      }
      @media (max-width: 800px) {
        body {
          display: block;
        }
        nav {
          position: static;
          width: auto;
          height: auto;
        }
        main {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <h1>{{TITLE}}</h1>
      <button id="theme-toggle" type="button">Switch theme</button>
      <div id="search">
        <input
          id="search-input"
          type="search"
          placeholder="Search in documents"
          autocomplete="off"
        />
        <div id="search-controls">
          <span id="search-count"></span>
          <button id="search-prev" type="button" title="Previous (Shift+Enter)">
            &uarr;
          </button>
          <button id="search-next" type="button" title="Next (Enter)">
            &darr;
          </button>
        </div>
      </div>
      {{NAV}}
    </nav>
    <main>{{CONTENT}}</main>
    <script>
      (function () {
        const root = document.documentElement;
        const button = document.getElementById("theme-toggle");
        const label = () => {
          button.textContent =
            root.dataset.theme === "dark" ? "Light mode" : "Dark mode";
        };
        button.addEventListener("click", () => {
          root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
          try {
            localStorage.setItem("theme", root.dataset.theme);
          } catch (error) {}
          label();
        });
        label();
      })();
      document.querySelectorAll("pre").forEach((block) => {
        const copyButton = document.createElement("button");
        copyButton.type = "button";
        copyButton.className = "copy-code";
        copyButton.textContent = "Copy";
        copyButton.addEventListener("click", () => {
          const text = block.querySelector("code").textContent;
          const done = () => {
            copyButton.textContent = "Copied";
            setTimeout(() => (copyButton.textContent = "Copy"), 1500);
          };
          const fallback = () => {
            const area = document.createElement("textarea");
            area.value = text;
            document.body.appendChild(area);
            area.select();
            document.execCommand("copy");
            area.remove();
            done();
          };
          if (navigator.clipboard && window.isSecureContext)
            navigator.clipboard.writeText(text).then(done, fallback);
          else fallback();
        });
        block.appendChild(copyButton);
      });
      (function () {
        const main = document.querySelector("main");
        const input = document.getElementById("search-input");
        const count = document.getElementById("search-count");
        const sections = [...document.querySelectorAll("section.doc")];
        const navLinks = [...document.querySelectorAll("nav a")];
        const MIN_LENGTH = 2;
        let marks = [];
        let current = -1;
        let timer;

        const clearMarks = () => {
          main.querySelectorAll("mark.search-hit").forEach((mark) => {
            mark.replaceWith(document.createTextNode(mark.textContent));
          });
          main.normalize();
        };

        const highlight = (query) => {
          const needle = query.toLowerCase();
          const walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT, {
            acceptNode: (node) =>
              node.parentElement.closest("button, script, style")
                ? NodeFilter.FILTER_REJECT
                : NodeFilter.FILTER_ACCEPT,
          });
          const nodes = [];
          while (walker.nextNode()) nodes.push(walker.currentNode);

          for (const node of nodes) {
            const text = node.nodeValue;
            const lower = text.toLowerCase();
            let index = lower.indexOf(needle);
            if (index === -1) continue;

            const fragment = document.createDocumentFragment();
            let last = 0;
            while (index !== -1) {
              fragment.append(text.slice(last, index));
              const mark = document.createElement("mark");
              mark.className = "search-hit";
              mark.textContent = text.slice(index, index + needle.length);
              fragment.append(mark);
              last = index + needle.length;
              index = lower.indexOf(needle, last);
            }
            fragment.append(text.slice(last));
            node.replaceWith(fragment);
          }

          return [...main.querySelectorAll("mark.search-hit")];
        };

        const go = (index) => {
          if (marks.length === 0) return;
          if (current >= 0) marks[current].classList.remove("current");
          current = (index + marks.length) % marks.length;
          marks[current].classList.add("current");
          marks[current].scrollIntoView({ block: "center" });
          count.textContent = `${current + 1} / ${marks.length}`;
        };

        const search = () => {
          clearMarks();
          marks = [];
          current = -1;
          navLinks.forEach((link) => (link.hidden = false));

          const query = input.value.trim();
          if (query.length < MIN_LENGTH) {
            count.textContent = query ? `Type ${MIN_LENGTH}+ characters` : "";
            return;
          }

          marks = highlight(query);
          sections.forEach((section) => {
            const link = navLinks.find(
              (item) => item.getAttribute("href") === `#${section.id}`,
            );
            if (link) link.hidden = !section.querySelector("mark.search-hit");
          });
          count.textContent = marks.length === 0 ? "No matches" : "";
          go(0);
        };

        input.addEventListener("input", () => {
          clearTimeout(timer);
          timer = setTimeout(search, 200);
        });
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter")
            go(event.shiftKey ? current - 1 : current + 1);
          if (event.key === "Escape") {
            input.value = "";
            search();
          }
        });
        document
          .getElementById("search-next")
          .addEventListener("click", () => go(current + 1));
        document
          .getElementById("search-prev")
          .addEventListener("click", () => go(current - 1));
      })();
    </script>
  </body>
</html>
